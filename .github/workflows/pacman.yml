name: generate pacman animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # fail before publishing so a broken run never overwrites the previous SVGs
      - name: verify generated SVGs
        run: |
          for file in dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg; do
            if [ ! -s "$file" ] || ! grep -q "<svg" "$file"; then
              echo "::error::$file is missing, empty or not a valid SVG"
              exit 1
            fi
          done

      # the branch is overwritten on every run, so it must not be shared with the snake workflow ('output')
      - name: push pacman-contribution-graph.svg to the output-pacman branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
